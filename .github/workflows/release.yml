name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check release tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version" }
      - name: Test, check public sources, build and smoke-test the real executable
        run: python tools/build_windows.py
      - name: Preserve reviewable release assets
        uses: actions/upload-artifact@v6
        with:
          name: Pimotai-Windows-x64-and-source
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GH_REPO" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber --repo "$env:GH_REPO"
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --title "拼模台 $env:GITHUB_REF_NAME" --generate-notes --repo "$env:GH_REPO"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
